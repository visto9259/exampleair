name: Publish to PyPI

# Publishing from CI on a tagged release is what Home Assistant asks for
# (dependency-transparency). Configure a "trusted publisher" for this
# repository and workflow on pypi.org; no API token is needed.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build   # builds the sdist and the wheel
      - uses: pypa/gh-action-pypi-publish@release/v1
