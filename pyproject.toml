[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exampleair"
version = "0.1.0"
description = "Async Python client for Example Air air quality monitors"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Eric Richer", email = "eric.richer@vistoconsulting.com" }]
keywords = ["home-assistant", "air quality", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-aiohttp>=1.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/visto9259/exampleair"
Issues = "https://github.com/visto9259/exampleair/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exampleair = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
